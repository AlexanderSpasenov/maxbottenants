name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maxbottenants_test
          POSTGRES_USER: maxbot
          POSTGRES_PASSWORD: maxbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maxbot -d maxbottenants_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      DATABASE_URL_SYNC: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      TEST_DATABASE_URL: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Migrations
        run: alembic upgrade head
      - name: Tests (including integration)
        run: pytest -q
