name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maxbottenants_test
          POSTGRES_USER: maxbot
          POSTGRES_PASSWORD: maxbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maxbot -d maxbottenants_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      DATABASE_URL_SYNC: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      TEST_DATABASE_URL: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Migrations
        run: alembic upgrade head
      - name: Tests (including integration)
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maxbottenants
          POSTGRES_USER: maxbot
          POSTGRES_PASSWORD: maxbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maxbot -d maxbottenants"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants
      DATABASE_URL_SYNC: postgresql+psycopg://maxbot:maxbot@localhost:5432/maxbottenants
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      ADMIN_SYNC_SECRET: ci-admin-secret
      APP_SECRET_KEY: ci-secret-key-not-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Docs/scripts sanity
        run: |
          bash -n scripts/backup_postgres.sh scripts/restore_postgres_to_test.sh scripts/pilot_readiness_check.sh
          test -f docs/ops-runbook.md
          test -f docs/pilot-readiness.md
          test -f docs/pii-request-runbook.md
      - name: Migrations
        run: alembic upgrade head
      - name: Start app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "app did not start" >&2
          exit 1
      - name: Readiness smoke
        run: |
          BASE_URL=http://127.0.0.1:8000 ADMIN_SYNC_SECRET=ci-admin-secret bash scripts/pilot_readiness_check.sh
      - name: Stop app
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then kill $(cat uvicorn.pid) || true; fi
